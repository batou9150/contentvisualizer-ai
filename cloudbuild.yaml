# Builds the image, pushes it to Artifact Registry and deploys to Cloud Run.
# Secrets come from Secret Manager; nothing sensitive is passed as a substitution or plain env var.
#
# One-time setup: see README "Deploy to Cloud Run".
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_GOOGLE_CLIENT_ID=xxx.apps.googleusercontent.com,_ALLOWED_USERS=@example.com
substitutions:
  _REGION: europe-west1
  _REPO: contentvisualizer
  _SERVICE: contentvisualizer-ai
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}
  _GOOGLE_CLIENT_ID: ''
  _ALLOWED_USERS: ''

steps:
  - id: test
    name: node:24-slim
    entrypoint: bash
    args: ['-c', 'npm ci && npm run typecheck && npm test']

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}:${BUILD_ID}', '-t', '${_IMAGE}:latest', '.']

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_IMAGE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${BUILD_ID}
      - --region=${_REGION}
      - --allow-unauthenticated
      - --service-account=${_SERVICE}@${PROJECT_ID}.iam.gserviceaccount.com
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,SESSION_SECRET=session-secret:latest
      # ^;^ switches gcloud's list delimiter so ALLOWED_USERS may contain commas.
      - --set-env-vars=^;^GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID};ALLOWED_USERS=${_ALLOWED_USERS}
      # Image generation at 4K can take a while.
      - --timeout=300
      - --memory=1Gi

images: ['${_IMAGE}:${BUILD_ID}', '${_IMAGE}:latest']

options:
  logging: CLOUD_LOGGING_ONLY
  # _IMAGE is built from other substitutions.
  dynamicSubstitutions: true
